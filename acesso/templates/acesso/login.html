{% extends "base.html" %}
{% block titulo %}Entrar — OTO{% endblock %}
{% block conteudo_publico %}
<div class="card oto-login-card shadow-lg border-0">
  <div class="card-body p-4 p-md-5">
    <div class="text-center mb-4">
      <span class="oto-login-logo mb-3"><i class="bi bi-compass-fill"></i></span>
      <h1 class="h4 fw-bold mb-1">Observatório de Turismo</h1>
      <p class="text-muted mb-0">Base de Dados Principal · Olímpia</p>
    </div>
    <form method="post">
      {% csrf_token %}
      {% if form.non_field_errors %}
        <div class="alert alert-danger py-2">{{ form.non_field_errors }}</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label" for="{{ form.username.id_for_label }}">Usuário</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" id="{{ form.username.id_for_label }}"
                 class="form-control" autofocus placeholder="Usuário" required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="{{ form.password.id_for_label }}"
                 class="form-control" placeholder="Senha" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2">
        <i class="bi bi-box-arrow-in-right"></i> Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
