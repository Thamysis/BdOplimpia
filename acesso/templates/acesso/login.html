{% extends "base.html" %}
{% block titulo %}Entrar — OTO{% endblock %}
{% block conteudo %}
<div class="cartao tela-login">
  <h1>Entrar</h1>
  <form method="post">
    {% csrf_token %}
    {% if form.non_field_errors %}<p class="erro">{{ form.non_field_errors }}</p>{% endif %}
    <div class="linha-form">
      <label for="{{ form.username.id_for_label }}">Usuário</label>
      {{ form.username }}
    </div>
    <div class="linha-form">
      <label for="{{ form.password.id_for_label }}">Senha</label>
      {{ form.password }}
    </div>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
